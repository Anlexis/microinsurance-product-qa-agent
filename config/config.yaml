# Runtime parameters — loaded and passed as Graph(config=...).
# Separate from config/agent.yaml (the flat registration manifest, which carries
# no runtime block; a runtime value placed there is read by nothing).

# Backbone retry budget: read by the framework's routing step.
max_retry: 3

# Per-invoke timeout budget. Recognised by the framework configuration
# contract; this template calls no external service, so nothing consumes it
# today.
timeout_s: 30

llm:
  # The grounding contract for the answer step. GenerateAnswerNode resolves
  # this path and records whether it resolved in its audit event, then
  # assembles the answer deterministically from the passages that cleared the
  # relevance floor. Sampling parameters are deliberately absent:
  # generation_mode is `deterministic` in the manifest, meaning no model is
  # invoked, and declaring a temperature that configures nothing is worse than
  # declaring nothing.
  system_prompt_template: "prompts/microinsurance_qa.j2"

# Retrieval tuning over the bundled product knowledge base. Every value is
# validated (type, finiteness, range) before it is forwarded to the inner
# graph; an invalid entry is dropped and the consuming node keeps its
# documented default.
retrieval:
  top_k: 5               # 1-50    (RetrieveNode) — candidate cap
  score_threshold: 0.15  # 0.0-1.0 (RerankFilterNode, GenerateAnswerNode) — relevance floor

security:
  # Records that the output boundary is active. PostProcessNode runs it
  # unconditionally — this key states the posture, it does not switch it.
  s3_gate_enabled: true
